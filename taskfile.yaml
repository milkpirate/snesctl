version: "3"

vars:
  nicenano_borad_definitions_url: https://github.com/ICantMakeThings/Nicenano-NRF52-Supermini-PlatformIO-Support/archive/refs/heads/main.tar.gz

tasks:
  .pio:
    desc: Run a PlatformIO command wrapper
    internal: true
    cmds:
      - uv run pio {{ .args }}

  setup:
    desc: Setup development environment
    status:
      - test -f .platformio_core/platforms/nordicnrf52/boards/nicenano.json
      - test -d .pio/libdeps/dummy
    cmds:
      - uv run pio pkg install -e dummy
      - curl -L {{ .nicenano_borad_definitions_url }}
        | tar -vxz -C .platformio_core/ --strip-components=2 --wildcards '*main/.platformio/*'
      - task: .pio
        vars:
          args: pkg install

  run:
    desc: Build the project
    # will only build if there are changes in the source files or platformio.ini
    sources:
      - 'lib/**'
      - 'src/**'
      - 'platformio.ini'
    generates:
      - .pio/build/nicenano/firmware.elf
    cmds:
      - task: setup
      - task: .pio
        vars:
          args: run

  upload:
    desc: Upload the project to the device
    cmds:
      - task: run
      - task: .pio
        vars:
          args: run -t upload

