version: "3"

tasks:
  .pio:
    internal: true
    cmds:
      - pio {{ .args }}

  run:
    desc: "pio run alias"
    sources:
      - 'lib/**'
      - 'src/**'
      - 'platformio.ini'
    cmds:
      - task: .pio
        vars:
          args: run

  upload:
    desc: "pio run alias"
    cmds:
      - task: run
      - task: .pio
        vars:
          args: run -t upload

