# coverage report of the host unit tests, see `task coverage`
root = .
# only the code under test (not the tests or Catch2)
filter = lib/
exclude-throw-branches = yes
exclude-unreachable-branches = yes

print-summary = yes
txt = -
html-details = reports/c.cov.html
html-title = SNESctl unit test coverage
cobertura = reports/c.cov.xml
markdown-summary = reports/c.cov.md
