; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
core_dir = .platformio_core/
; nice!nano board definition and variant (pinout), downloaded by `task setup` from
; https://github.com/ICantMakeThings/Nicenano-NRF52-Supermini-PlatformIO-Support
; into the project, so nothing has to be merged into the PlatformIO core dir
boards_dir = boards
default_envs = nicenano

[env:nicenano]
platform = nordicnrf52
board = nicenano
board_build.variants_dir = variants
framework = arduino
platform_packages =
  platformio/toolchain-gccarmnoneeabi @ ^1.140201.0
build_flags =
  -std=gnu23
  -std=gnu++23
build_unflags =
  -std=gnu11
  -std=gnu++11
;  -DWAIT_FOR_SERIAL       ; block on boot until the USB serial is opened (never boots on battery!)
;  -DDEBUG_HID_REPORT      ; print every HID report sent
;  -DDEBUG_BATTERY_REPORT  ; print every battery report sent
extra_scripts =
  pre:scripts/version.py   ; firmware revision (git describe) for the BLE device information service
  post:scripts/uf2.py      ; additionally build firmware.uf2 for drag and drop flashing
test_ignore = *            ; unit tests run on the host, see env:native
monitor_speed = 115200

debug_tool = jlink
debug_build_flags =
  -Og             ; Optimize for debugging
  -g3             ; Maximum debug information
  -fno-inline     ; Prevent function inlining
  -fno-omit-frame-pointer

; host unit tests (Catch2) of the hardware independent code, run with `task test`
[env:native]
platform = native
test_framework = custom
build_flags =
  -std=gnu++23
  -Wall
  -Wextra
  -Ilib/SNESCtrl
; only the header only parts are tested, the rest depends on the Arduino framework
lib_ignore =
  SNESCtrl
  Debug
