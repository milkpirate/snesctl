; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
core_dir = .platformio_core/
; nice!nano board definition and variant (pinout), downloaded by `task setup` from
; https://github.com/ICantMakeThings/Nicenano-NRF52-Supermini-PlatformIO-Support
; into the project, so nothing has to be merged into the PlatformIO core dir
boards_dir = boards
default_envs = supermini, nicenano_v2, nicenano_v1

; common settings of the nice!nano environments below
[nicenano]
platform = nordicnrf52
board = nicenano
board_build.variants_dir = variants
framework = arduino
platform_packages =
  platformio/toolchain-gccarmnoneeabi @ ^1.140201.0
build_flags =
  -std=gnu23
  -std=gnu++23
build_unflags =
  -std=gnu11
  -std=gnu++11
;  -DWAIT_FOR_SERIAL       ; block on boot until the USB serial is opened (never boots on battery!)
;  -DDEBUG_HID_REPORT      ; print every HID report sent
;  -DDEBUG_BATTERY_REPORT  ; print every battery report sent
extra_scripts =
  pre:scripts/version.py   ; firmware revision (git describe) for the BLE device information service
  post:scripts/uf2.py      ; additionally build firmware.uf2 for drag and drop flashing
test_ignore = *            ; unit tests run on the host, see env:native
monitor_speed = 115200

debug_tool = jlink
debug_build_flags =
  -Og             ; Optimize for debugging
  -g3             ; Maximum debug information
  -fno-inline     ; Prevent function inlining
  -fno-omit-frame-pointer

; the board revisions differ in the external VCC switch polarity and the battery measurement,
; configured in config/<env>/BoardConfig.hpp (selected via the include path)
[env:nicenano_v2]
extends = nicenano
build_flags =
  ${nicenano.build_flags}
  -Iconfig/nicenano_v2

[env:nicenano_v1]
extends = nicenano
build_flags =
  ${nicenano.build_flags}
  -Iconfig/nicenano_v1

; nice!nano v2 clone (aka "ProMicro NRF52840"), with DC/DC enabled
[env:supermini]
extends = nicenano
build_flags =
  ${nicenano.build_flags}
  -Iconfig/supermini

; prints which nice!nano revision it runs on (see tools/board-probe), flash with `task probe`
[env:probe]
extends = nicenano
build_src_filter = -<*> +<../tools/board-probe/>

; switches the external VCC on/off every 20s, to measure the leak of its pull-up (see tools/vcc-test), `task vcc-test`
[env:vcc_test]
extends = nicenano
build_src_filter = -<*> +<../tools/vcc-test/>

; host unit tests (Catch2) of the hardware independent code, run with `task test` or `task coverage`
[env:native]
platform = native
test_framework = custom
build_flags =
  -std=gnu++23
  -Wall
  -Wextra
  -Ilib/SNESCtrl
  ; coverage instrumentation, report with `task coverage` (see gcovr.cfg)
  --coverage
  -fprofile-abs-path
  -lgcov
; only the header only parts are tested, the rest depends on the Arduino framework
lib_ignore =
  SNESCtrl
  Debug
