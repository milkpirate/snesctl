name: build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install task
        uses: go-task/setup-task@v1

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: task setup

      - name: Build firmware
        run: task run

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: snesctl-firmware
          path: .pio/build/nicenano/firmware.*