name: build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install task
        uses: go-task/setup-task@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0  # no major version tags are published
        with:
          enable-cache: true

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            .platformio_core
            .pio/catch2
          key: platformio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'test/test_custom_runner.py', 'uv.lock') }}
          restore-keys: platformio-${{ runner.os }}-

      - name: Install dependencies
        run: task setup

      - name: Run unit tests (with coverage)
        run: task coverage

      - name: Add coverage to the job summary
        run: cat reports/c.cov.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: reports/

      - name: Build firmware
        run: task run

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: snesctl-firmware
          path: |
            .pio/build/*/firmware.hex
            .pio/build/*/firmware.uf2
            .pio/build/*/firmware.zip
          if-no-files-found: error

      # the following builds are not uploaded, they only make sure everything still compiles. They run after
      # uploading the artifacts, as they rebuild the firmware.
      - name: Build firmware with debug output
        env:
          PLATFORMIO_BUILD_FLAGS: -DDEBUG_HID_REPORT -DDEBUG_BATTERY_REPORT
        run: uv run pio run

      - name: Build tools (board probe, VCC test)
        run: uv run pio run -e probe -e vcc_test
