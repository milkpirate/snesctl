name: build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: PIO run
        uses: karniv00l/platformio-run-action@v1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sn
          path: ${{ steps.find_sdk.outputs.sdk_file }}